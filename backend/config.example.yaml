# 渠道项目管理系统 - 配置文件示例
# 复制此文件为 config.yaml 并填入实际值（config.yaml 已被 .gitignore 排除）
database:
  url: "sqlite:///./data.db"

jwt:
  # 必填：JWT 签名密钥（生产环境必须改成随机字符串，长度 >= 32）
  # 生成方法：python -c "import secrets; print(secrets.token_urlsafe(48))"
  secret_key: "your-super-secret-key-change-in-production"
  algorithm: "HS256"
  expire_minutes: 1440  # token 有效期（分钟），默认 1 天

webdav:
  enabled: false       # true=远程 WebDAV / false=本地存储
  base_url: ""         # NAS 地址，如 https://192.168.1.100:5006
  username: ""         # NAS 登录账号
  password: ""         # NAS 登录密码（不要提交到 git！）
  remote_path: "/"     # 远程根路径

upload:
  local_path: "./uploads"

app:
  host: "0.0.0.0"
  port: 8000
  debug: true
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

# 环境变量（可选）：
# DEFAULT_ADMIN_PASSWORD - 首次启动时创建的默认管理员密码（不设则用 Admin@2026）
